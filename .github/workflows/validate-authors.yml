name: Validate trusted authors

on:
  pull_request:
    paths:
      - "apps/**/*.json"
      - "trusted_authors.json"

jobs:
  check-authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/check_trusted_authors.py
